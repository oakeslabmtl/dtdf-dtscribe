Data :
	DepthImageData
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Depth image data received from the Intel D435i camera.
		fromData : DepthImageDataT
		inputTo : DataPreProcessingEnabler/DataTranslationEnabler
		sameAs : DepthImageData
	LiDARPointCloudData
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Point‑cloud data received from the Hokuyo LiDAR.
		fromData : LiDARPointCloudDataT
		inputTo : DataPreProcessingEnabler/DataTranslationEnabler
		sameAs : LiDARPointCloudData
	ObjectTrackData
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Clustered and filtered object track data derived from LiDAR point‑cloud.
		fromData : LiDARPointCloudDataT
		inputTo : ControllingEnabler/DataPreProcessingEnabler
		sameAs : ObjectTrackData
	PredictedPathData
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Predicted driving path generated by the ACC controller.
		inputTo : ControllingEnabler/VisualizationEnabler
		sameAs : PredictedPathData
	VehicleSpeedSignal
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Vehicle speed signal after serialization and unit conversion.
		fromData : VehicleSpeedDataT
		inputTo : ControllingEnabler/DataTranslationEnabler
		sameAs : VehicleSpeedSignal
	VehicleSteeringAngleSignal
		type : ContainedElement/DescribedThing/NamedIndividual/Data/Thing/DTComponent/FidelityThing/ImplementationThing/Input/Component/ConceptInstance
		desc : Vehicle steering‑angle signal after serialization and unit conversion.
		fromData : VehicleSteeringAngleDataT
		inputTo : ActuationEnabler
		sameAs : VehicleSteeringAngleSignal
